# ============================================================
#  SOURCES DE LA VEILLE JURIDIQUE IA
# ------------------------------------------------------------
#  Chaque source a :
#    nom     : le nom affiché dans le bulletin
#    pays    : France / Maroc / Côte d'Ivoire / Europe
#    type    : "officiel", "regulateur", "presse" ou "doctrine"
#              (sert à indiquer le niveau de fiabilité)
#    url     : l'adresse du flux RSS
#    actif   : true pour l'utiliser, false pour la mettre en pause
#
#  Pour ajouter une source : copie un bloc, change les valeurs.
#  Pour désactiver une source qui ne répond plus : actif: false
# ============================================================

sources:

  # ----------------------------------------------------------
  #  FRANCE + EUROPE  -> flux RSS officiels, très fiables
  # ----------------------------------------------------------

  - nom: "CNIL - actualités"
    pays: "France"
    type: "regulateur"
    url: "https://www.cnil.fr/fr/rss.xml"
    actif: true

  - nom: "Conseil d'État - actualités"
    pays: "France"
    type: "officiel"
    url: "https://www.conseil-etat.fr/rss/actualites"
    actif: true

  - nom: "Commission européenne - numérique"
    pays: "Europe"
    type: "officiel"
    url: "https://digital-strategy.ec.europa.eu/en/rss.xml"
    actif: true

  - nom: "Comité européen de la protection des données (EDPB)"
    pays: "Europe"
    type: "regulateur"
    url: "https://www.edpb.europa.eu/feed/news_en"
    actif: true

  # Recherche Google Actualités : filet de sécurité si un flux officiel tombe
  - nom: "Google Actualités - IA et droit (France)"
    pays: "France"
    type: "presse"
    url: "https://news.google.com/rss/search?q=%22intelligence+artificielle%22+(loi+OR+r%C3%A8glement+OR+justice+OR+CNIL)+France&hl=fr&gl=FR&ceid=FR:fr"
    actif: true

  # ----------------------------------------------------------
  #  MAROC  -> pas de RSS officiel fiable depuis l'étranger,
  #            on passe donc par Google Actualités (ça, ça marche
  #            depuis GitHub Actions) + surveillance manuelle.
  # ----------------------------------------------------------

  - nom: "Google Actualités - IA et droit (Maroc)"
    pays: "Maroc"
    type: "presse"
    url: "https://news.google.com/rss/search?q=%22intelligence+artificielle%22+(loi+OR+projet+de+loi+OR+justice+OR+CNDP+OR+num%C3%A9rique)+Maroc&hl=fr&gl=MA&ceid=MA:fr"
    actif: true

  - nom: "Google Actualités - CNDP et données personnelles (Maroc)"
    pays: "Maroc"
    type: "presse"
    url: "https://news.google.com/rss/search?q=(CNDP+OR+%22donn%C3%A9es+personnelles%22+OR+%2209-08%22)+Maroc&hl=fr&gl=MA&ceid=MA:fr"
    actif: true

  - nom: "Google Actualités - Bulletin officiel et textes (Maroc)"
    pays: "Maroc"
    type: "presse"
    url: "https://news.google.com/rss/search?q=(%22bulletin+officiel%22+OR+d%C3%A9cret+OR+%22projet+de+loi%22)+(num%C3%A9rique+OR+%22intelligence+artificielle%22+OR+donn%C3%A9es)+Maroc&hl=fr&gl=MA&ceid=MA:fr"
    actif: true

  # ----------------------------------------------------------
  #  CÔTE D'IVOIRE  -> même logique que le Maroc
  # ----------------------------------------------------------

  - nom: "Google Actualités - IA et droit (Côte d'Ivoire)"
    pays: "Côte d'Ivoire"
    type: "presse"
    url: "https://news.google.com/rss/search?q=%22intelligence+artificielle%22+(loi+OR+justice+OR+num%C3%A9rique+OR+ARTCI)+%22C%C3%B4te+d%27Ivoire%22&hl=fr&gl=CI&ceid=CI:fr"
    actif: true

  - nom: "Google Actualités - ARTCI et données personnelles (Côte d'Ivoire)"
    pays: "Côte d'Ivoire"
    type: "presse"
    url: "https://news.google.com/rss/search?q=(ARTCI+OR+%22donn%C3%A9es+personnelles%22+OR+%222013-450%22)+%22C%C3%B4te+d%27Ivoire%22&hl=fr&gl=CI&ceid=CI:fr"
    actif: true

  - nom: "Google Actualités - textes et décrets (Côte d'Ivoire)"
    pays: "Côte d'Ivoire"
    type: "presse"
    url: "https://news.google.com/rss/search?q=(%22journal+officiel%22+OR+d%C3%A9cret+OR+ordonnance)+(num%C3%A9rique+OR+%22intelligence+artificielle%22+OR+donn%C3%A9es)+%22C%C3%B4te+d%27Ivoire%22&hl=fr&gl=CI&ceid=CI:fr"
    actif: true


# ============================================================
#  SOURCES À SURVEILLER À LA MAIN (ou avec Visualping)
#  Le script ne peut pas les lire : pas de flux RSS, et certains
#  sites bloquent les connexions venant de l'étranger.
#  Elles sont rappelées en bas du bulletin pour que tu n'oublies pas.
# ============================================================

surveillance_manuelle:

  - nom: "CNDP Maroc - actualités"
    pays: "Maroc"
    url: "https://www.cndp.ma/fr/"

  - nom: "SGG Maroc - Bulletin officiel"
    pays: "Maroc"
    url: "https://www.sgg.gov.ma/BulletinOfficiel.aspx"

  - nom: "Ministère de la Justice - Maroc"
    pays: "Maroc"
    url: "https://www.justice.gov.ma/"

  - nom: "ARTCI - Côte d'Ivoire"
    pays: "Côte d'Ivoire"
    url: "https://www.artci.ci/"

  - nom: "Secrétariat général du Gouvernement - Côte d'Ivoire"
    pays: "Côte d'Ivoire"
    url: "https://www.sgg.gouv.ci/"

  - nom: "Légifrance (via l'API PISTE, à brancher plus tard)"
    pays: "France"
    url: "https://www.legifrance.gouv.fr/"
